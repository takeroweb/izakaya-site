<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>お品書き | 炉端酒場 灯り</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Noto+Serif+JP:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black: #0C0B09;
      --dark: #17150F;
      --dark2: #1E1B12;
      --gold: #C9A84C;
      --gold-light: #E2C47A;
      --gold-dim: rgba(201,168,76,0.12);
      --cream: #F2EDD8;
      --text: #F0EBD8;
      --text-muted: #9A8F7E;
      --border: rgba(201,168,76,0.2);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      background: var(--dark);
      color: var(--text);
      min-height: 100vh;
    }

    /* ===== HEADER ===== */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(12,11,9,0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 40px;
    }

    .header-back {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 13px;
      letter-spacing: .05em;
      transition: color .2s;
    }

    .header-back:hover { color: var(--gold); }
    .header-back svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }

    .header-title {
      font-family: 'Noto Serif JP', serif;
      font-size: 16px;
      color: var(--gold);
      letter-spacing: .15em;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
    }

    /* ===== HERO STRIP ===== */
    .menu-hero {
      background: var(--black);
      padding: 56px 40px 48px;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }

    .menu-hero-eyebrow {
      font-family: 'Cormorant Garamond', serif;
      font-size: 12px;
      letter-spacing: .4em;
      color: var(--gold);
      text-transform: uppercase;
      margin-bottom: 14px;
      display: block;
    }

    .menu-hero-title {
      font-family: 'Noto Serif JP', serif;
      font-size: 28px;
      font-weight: 700;
      color: var(--cream);
      letter-spacing: .1em;
      margin-bottom: 12px;
    }

    .menu-hero-sub {
      font-size: 13px;
      color: var(--text-muted);
      letter-spacing: .05em;
    }

    /* ===== CATEGORY NAV ===== */
    .cat-nav {
      position: sticky;
      top: 64px;
      z-index: 90;
      background: rgba(23,21,15,0.97);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      display: flex;
      overflow-x: auto;
      scrollbar-width: none;
      padding: 0 20px;
    }

    .cat-nav::-webkit-scrollbar { display: none; }

    .cat-nav-item {
      padding: 14px 20px;
      font-size: 13px;
      color: var(--text-muted);
      white-space: nowrap;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: color .2s, border-color .2s;
      flex-shrink: 0;
      text-decoration: none;
      display: block;
    }

    .cat-nav-item:hover,
    .cat-nav-item.active { color: var(--gold); border-bottom-color: var(--gold); }

    /* ===== MAIN CONTENT ===== */
    .menu-main {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 40px 80px;
    }

    /* ===== CATEGORY SECTION ===== */
    .cat-section {
      padding-top: 64px;
    }

    .cat-section-header {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 32px;
    }

    .cat-section-label {
      font-family: 'Noto Serif JP', serif;
      font-size: 20px;
      font-weight: 700;
      color: var(--cream);
      letter-spacing: .1em;
      white-space: nowrap;
    }

    .cat-section-line {
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .cat-section-en {
      font-family: 'Cormorant Garamond', serif;
      font-size: 11px;
      letter-spacing: .3em;
      color: var(--gold);
      text-transform: uppercase;
      white-space: nowrap;
    }

    /* ===== ITEM LIST ===== */
    .item-list { display: flex; flex-direction: column; gap: 0; }

    .item-row {
      display: grid;
      grid-template-columns: 96px 1fr auto;
      gap: 20px;
      align-items: center;
      padding: 20px 0;
      border-bottom: 1px solid rgba(201,168,76,0.1);
      transition: background .15s;
    }

    .item-row:first-child { border-top: 1px solid rgba(201,168,76,0.1); }

    .item-row:hover { background: rgba(201,168,76,0.04); margin: 0 -16px; padding: 20px 16px; }

    .item-thumb {
      width: 96px;
      height: 72px;
      object-fit: cover;
      border-radius: 4px;
      display: block;
      background: var(--dark2);
    }

    .item-thumb-placeholder {
      width: 96px;
      height: 72px;
      background: var(--dark2);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      opacity: .4;
    }

    .item-body { min-width: 0; }

    .item-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--cream);
      margin-bottom: 6px;
    }

    .item-desc {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.8;
    }

    .item-price {
      font-size: 16px;
      font-weight: 700;
      color: var(--gold);
      white-space: nowrap;
      text-align: right;
      flex-shrink: 0;
    }

    /* ===== NOTE ===== */
    .menu-note {
      text-align: center;
      padding: 40px 20px;
      font-size: 12px;
      color: var(--text-muted);
      line-height: 2;
    }

    /* ===== FOOTER ===== */
    footer {
      background: var(--black);
      border-top: 1px solid var(--border);
      padding: 32px 40px;
      text-align: center;
    }

    .footer-back {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 13px;
      letter-spacing: .05em;
      border: 1px solid var(--border);
      padding: 12px 28px;
      transition: border-color .2s, color .2s;
    }

    .footer-back:hover { border-color: var(--gold); color: var(--gold); }
    .footer-back svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; }

    /* ===== MODAL ===== */
    .item-modal-overlay {
      position: fixed; inset: 0; z-index: 500;
      background: rgba(12,11,9,0.88);
      backdrop-filter: blur(6px);
      display: none; align-items: center; justify-content: center;
      padding: 20px;
    }
    .item-modal-overlay.open { display: flex; }

    .item-modal {
      background: var(--dark2);
      border: 1px solid var(--border);
      border-radius: 8px;
      max-width: 480px;
      width: 100%;
      position: relative;
      overflow: hidden;
      animation: modalIn .2s ease;
    }

    @keyframes modalIn {
      from { opacity: 0; transform: translateY(16px) scale(.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .item-modal-close {
      position: absolute; top: 12px; right: 12px;
      background: rgba(0,0,0,0.5); border: none;
      color: var(--text); border-radius: 50%;
      width: 32px; height: 32px; font-size: 16px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      z-index: 1;
    }

    .item-modal-img {
      width: 100%; aspect-ratio: 4/3; object-fit: cover;
      display: block; background: var(--black);
    }

    .item-modal-img-placeholder {
      width: 100%; aspect-ratio: 4/3;
      background: var(--black);
      display: flex; align-items: center; justify-content: center;
      font-size: 48px; opacity: .3;
    }

    .item-modal-body { padding: 24px; }

    .item-modal-name {
      font-size: 20px; font-weight: 700;
      color: var(--cream); margin-bottom: 10px;
      font-family: 'Noto Serif JP', serif;
    }

    .item-modal-desc {
      font-size: 13px; color: var(--text-muted);
      line-height: 1.9; margin-bottom: 16px;
    }

    .item-modal-price {
      font-size: 20px; font-weight: 700; color: var(--gold);
    }

    /* ===== LOADING ===== */
    #loading {
      text-align: center;
      padding: 80px 20px;
      color: var(--text-muted);
      font-size: 14px;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 640px) {
      header { padding: 0 20px; }
      .menu-hero { padding: 40px 20px 36px; }
      .menu-main { padding: 0 20px 60px; }
      .item-row { grid-template-columns: 72px 1fr auto; gap: 14px; padding: 16px 0; }
      .item-row:hover { margin: 0 -8px; padding: 16px 8px; }
      .item-thumb { width: 72px; height: 54px; }
      .item-thumb-placeholder { width: 72px; height: 54px; }
      .item-name { font-size: 14px; }
      .item-price { font-size: 14px; }
      .cat-nav { padding: 0 12px; }
    }
  </style>
</head>
<body>

<header>
  <a class="header-back" href="index.html">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    トップへ戻る
  </a>
  <span class="header-title">お品書き</span>
</header>

<div class="menu-hero">
  <span class="menu-hero-eyebrow">Menu</span>
  <h1 class="menu-hero-title">お品書き</h1>
  <p class="menu-hero-sub">備長炭の炉端と、長崎の旬を肴に</p>
</div>

<nav class="cat-nav" id="cat-nav"></nav>

<div id="loading">読み込み中...</div>

<main class="menu-main" id="menu-main" style="display:none;"></main>

<div class="menu-note">
  ※ 仕入れ状況により内容が変わる場合がございます。<br>
  ※ 表示価格はすべて税込みです。
</div>

<!-- ===== ITEM MODAL ===== -->
<div class="item-modal-overlay" id="item-modal" onclick="closeModal()">
  <div class="item-modal" onclick="event.stopPropagation()">
    <button class="item-modal-close" onclick="closeModal()">✕</button>
    <div id="modal-img-wrap"></div>
    <div class="item-modal-body">
      <p class="item-modal-name" id="modal-name"></p>
      <p class="item-modal-desc" id="modal-desc"></p>
      <p class="item-modal-price" id="modal-price"></p>
    </div>
  </div>
</div>

<footer>
  <a class="footer-back" href="index.html">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    トップページへ戻る
  </a>
</footer>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="data.js"></script>
<script>
  firebase.initializeApp({
    apiKey: "AIzaSyCoSxScuwyr7IWOb_Y9-eTT1SJkP7F3PHU",
    authDomain: "takeroweb-demo.firebaseapp.com",
    projectId: "takeroweb-demo",
    storageBucket: "takeroweb-demo.firebasestorage.app",
    messagingSenderId: "1020678335636",
    appId: "1:1020678335636:web:c847c9668591859d3c5881"
  });
  const db = firebase.firestore();

  function renderMenu(data) {
    const cats = (data.menu && data.menu.categories) ? data.menu.categories : [];
    const nav  = document.getElementById('cat-nav');
    const main = document.getElementById('menu-main');

    nav.innerHTML  = '';
    main.innerHTML = '';

    cats.forEach((cat, ci) => {
      // ナビリンク
      const navItem = document.createElement('a');
      navItem.className = 'cat-nav-item';
      navItem.textContent = cat.label;
      navItem.href = `#cat-${ci}`;
      nav.appendChild(navItem);

      // セクション
      const section = document.createElement('section');
      section.className = 'cat-section';
      section.id = `cat-${ci}`;

      const header = document.createElement('div');
      header.className = 'cat-section-header';
      header.innerHTML = `
        <span class="cat-section-label">${esc(cat.label)}</span>
        <span class="cat-section-line"></span>
      `;
      section.appendChild(header);

      const list = document.createElement('div');
      list.className = 'item-list';

      (cat.items || []).forEach(item => {
        const row = document.createElement('div');
        row.className = 'item-row';
        row.style.cursor = 'pointer';

        let imgEl;
        if (item.image) {
          imgEl = `<img class="item-thumb" src="${esc(item.image)}" alt="${esc(item.name)}" loading="lazy" />`;
        } else {
          imgEl = `<div class="item-thumb-placeholder">🍶</div>`;
        }

        row.innerHTML = `
          ${imgEl}
          <div class="item-body">
            <div class="item-name">${esc(item.name)}</div>
            <div class="item-desc">${esc(item.desc)}</div>
          </div>
          <div class="item-price">${esc(item.price)}</div>
        `;
        row.onclick = () => openModal(item);
        list.appendChild(row);
      });

      section.appendChild(list);
      main.appendChild(section);
    });

    document.getElementById('loading').style.display = 'none';
    main.style.display = '';

    // アクティブナビ（スクロール連動）
    const sections = document.querySelectorAll('.cat-section');
    const navItems = document.querySelectorAll('.cat-nav-item');
    const catNavEl = document.getElementById('cat-nav');

    const io = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const id = entry.target.id;
          navItems.forEach(ni => {
            const active = ni.getAttribute('href') === `#${id}`;
            ni.classList.toggle('active', active);
            if (active) {
              ni.scrollIntoView({ inline: 'center', behavior: 'smooth', block: 'nearest' });
            }
          });
        }
      });
    }, { rootMargin: '-30% 0px -60% 0px' });

    sections.forEach(s => io.observe(s));
  }

  function openModal(item) {
    const imgWrap = document.getElementById('modal-img-wrap');
    if (item.image) {
      imgWrap.innerHTML = `<img class="item-modal-img" src="${esc(item.image)}" alt="${esc(item.name)}" />`;
    } else {
      imgWrap.innerHTML = `<div class="item-modal-img-placeholder">🍶</div>`;
    }
    document.getElementById('modal-name').textContent  = item.name;
    document.getElementById('modal-desc').textContent  = item.desc;
    document.getElementById('modal-price').textContent = item.price;
    document.getElementById('item-modal').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeModal() {
    document.getElementById('item-modal').classList.remove('open');
    document.body.style.overflow = '';
  }

  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  function esc(str) {
    return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  loadData(db).then(data => renderMenu(data));
</script>
</body>
</html>
